<svg
  width="100%"
  height="22"
  viewBox="0 0 1200 22"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Animated RGB LED line"
>
  <defs>
    <linearGradient
      id="rgb-line"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#5b8cff" />
      <stop offset="25%" stop-color="#a875ff" />
      <stop offset="50%" stop-color="#ff7eb3" />
      <stop offset="75%" stop-color="#62d9c7" />
      <stop offset="100%" stop-color="#5b8cff" />

      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        values="-1 0; 1 0; -1 0"
        dur="12s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <filter id="soft-glow" x="-20%" y="-300%" width="140%" height="700%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect
    x="30"
    y="9"
    width="1140"
    height="4"
    rx="2"
    fill="url(#rgb-line)"
    opacity="0.72"
    filter="url(#soft-glow)"
  />

  <rect
    x="30"
    y="10"
    width="1140"
    height="2"
    rx="1"
    fill="#ffffff"
    opacity="0.18"
  />
</svg>